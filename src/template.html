<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NOVA EV-1 · 纯电整车拆解可视化</title>
<style>
  /* ============ 基础 ============ */
  :root{
    --cyan:#38e8ff;
    --cyan-soft:rgba(56,232,255,.55);
    --cyan-line:rgba(56,232,255,.16);
    --violet:#8a7bff;
    --amber:#ffb84d;
    --bg:#04070b;
    --text:#dce9f4;
    --muted:#7d94a9;
    --muted-2:#5a7080;
    --panel:rgba(9,17,26,.72);
    --panel-2:rgba(12,22,33,.86);
    --stroke:rgba(120,190,215,.14);
    --mono:"SFMono-Regular",Consolas,"JetBrains Mono","Cascadia Mono",monospace;
    --sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);}
  body{
    font-family:var(--sans);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1200px 760px at 52% 30%, #0d1c2b 0%, #071019 42%, #03060a 72%, #010204 100%);
  }
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  canvas#scene:active{cursor:grabbing;}
  .ui{position:fixed;inset:0;pointer-events:none;z-index:5;}
  .ui > *{pointer-events:auto;}

  /* 背景装饰：网格 + 扫描线 + 暗角 */
  .deco{position:fixed;inset:0;pointer-events:none;z-index:1;}
  .deco .grid{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(56,232,255,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(56,232,255,.045) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(circle at 50% 42%,rgba(0,0,0,.85),transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 42%,rgba(0,0,0,.85),transparent 72%);
    opacity:.55;
  }
  .deco .vignette{
    position:absolute;inset:0;
    background:radial-gradient(circle at 50% 45%,transparent 38%,rgba(0,0,0,.55) 100%);
  }
  .deco .scan{
    position:absolute;left:0;right:0;height:180px;top:-200px;
    background:linear-gradient(180deg,transparent,rgba(56,232,255,.05) 55%,transparent);
    animation:scan 9s linear infinite;
  }
  @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(calc(100vh + 240px))}}

  /* ============ 顶栏 ============ */
  .topbar{
    position:absolute;top:0;left:0;right:0;height:74px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;
    background:linear-gradient(180deg,rgba(4,8,12,.86),rgba(4,8,12,0));
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;position:relative;
    background:linear-gradient(140deg,rgba(56,232,255,.22),rgba(56,232,255,.03));
    border:1px solid rgba(56,232,255,.35);
    box-shadow:0 0 22px rgba(56,232,255,.22),inset 0 0 14px rgba(56,232,255,.12);
    display:grid;place-items:center;
  }
  .brand-mark svg{width:22px;height:22px;filter:drop-shadow(0 0 6px rgba(56,232,255,.8));}
  .brand h1{margin:0;font-size:16px;letter-spacing:.24em;font-weight:600;}
  .brand .sub{
    margin-top:3px;font-family:var(--mono);font-size:9.5px;letter-spacing:.28em;
    color:var(--muted-2);text-transform:uppercase;
  }
  .brand .sub b{color:var(--cyan);font-weight:500;}
  .top-right{display:flex;align-items:center;gap:10px;}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    height:28px;padding:0 12px;border-radius:999px;
    border:1px solid var(--stroke);background:rgba(10,20,30,.55);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:#a9c3d4;
    backdrop-filter:blur(8px);
  }
  .chip i{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);display:block;}
  .chip.warn i{background:var(--amber);box-shadow:0 0 8px var(--amber);}
  .chip b{color:#fff;font-weight:600;}

  /* ============ 电池方案切换 ============ */
  .chembar{
    position:absolute;top:88px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:11px;
    padding:6px 10px 6px 14px;border-radius:999px;
    background:rgba(7,14,21,.74);border:1px solid var(--stroke);
    backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 14px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
    z-index:8;max-width:calc(100% - 40px);
  }
  .chem-label{
    display:flex;align-items:center;gap:6px;white-space:nowrap;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--muted-2);
  }
  .chem-label i{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
  .chem-opts{display:flex;gap:3px;}
  .chem-opts button{
    display:flex;align-items:center;gap:6px;height:28px;padding:0 11px;
    border-radius:999px;border:1px solid transparent;background:transparent;
    color:#9fb8c8;font-family:var(--sans);font-size:11.5px;letter-spacing:.04em;
    cursor:pointer;transition:background .18s,color .18s,box-shadow .18s;white-space:nowrap;
  }
  .chem-opts button b{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;font-weight:400;opacity:.5;}
  .chem-opts button:hover{background:rgba(56,232,255,.09);color:#eafcff;}
  .chem-opts button.on{
    background:linear-gradient(135deg,rgba(56,232,255,.92),rgba(40,160,255,.86));
    color:#031018;font-weight:600;box-shadow:0 4px 16px rgba(56,232,255,.28);
  }
  .chem-opts button.on b{opacity:.65;color:#031018;}

  /* 切换提示 */
  .toast{
    position:fixed;left:50%;bottom:150px;transform:translate(-50%,10px);
    padding:8px 16px;border-radius:999px;z-index:30;pointer-events:none;
    background:rgba(6,16,24,.92);border:1px solid rgba(56,232,255,.35);
    color:#d9f4ff;font-size:12px;letter-spacing:.08em;white-space:nowrap;
    opacity:0;transition:opacity .25s,transform .25s;
    box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 24px rgba(56,232,255,.15);
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}

  /* ============ 面板通用 ============ */
  .panel{
    position:absolute;top:92px;bottom:118px;width:272px;
    display:flex;flex-direction:column;
    background:var(--panel);
    border:1px solid var(--stroke);
    border-radius:14px;
    backdrop-filter:blur(16px) saturate(1.2);
    box-shadow:0 18px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);
    overflow:hidden;
  }
  .panel::before{
    content:"";position:absolute;top:0;left:14%;right:14%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(56,232,255,.55),transparent);
  }
  .panel.left{left:22px;}
  .panel.right{right:22px;width:330px;}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:15px 16px 12px;border-bottom:1px solid rgba(120,190,215,.1);
  }
  .panel-title{display:flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:.16em;color:#cfe6f2;}
  .panel-title .dot{width:6px;height:6px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);border-radius:2px;transform:rotate(45deg);}
  .panel-head .meta{font-family:var(--mono);font-size:10px;color:var(--muted-2);letter-spacing:.1em;}
  .panel-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px;scrollbar-width:thin;scrollbar-color:rgba(56,232,255,.28) transparent;}
  .panel-body::-webkit-scrollbar{width:6px;}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(56,232,255,.24);border-radius:99px;}
  .panel-body::-webkit-scrollbar-track{background:transparent;}

  /* ============ 部件清单 ============ */
  .cat-title{
    display:flex;align-items:center;gap:8px;
    padding:12px 8px 7px;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.22em;color:var(--muted-2);text-transform:uppercase;
  }
  .cat-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(120,190,215,.18),transparent);}
  .item{
    display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:9px;
    padding:9px 9px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;
    transition:background .18s,border-color .18s,transform .18s;
    position:relative;
  }
  .item:hover{background:rgba(56,232,255,.055);border-color:rgba(56,232,255,.14);}
  .item.active{
    background:linear-gradient(90deg,rgba(56,232,255,.16),rgba(56,232,255,.03));
    border-color:rgba(56,232,255,.35);
    box-shadow:0 0 18px rgba(56,232,255,.1),inset 0 0 20px rgba(56,232,255,.05);
  }
  .item.active::before{
    content:"";position:absolute;left:0;top:16%;bottom:16%;width:2px;border-radius:2px;
    background:var(--cyan);box-shadow:0 0 10px var(--cyan);
  }
  .item .idx{font-family:var(--mono);font-size:10px;color:var(--muted-2);letter-spacing:.04em;}
  .item.active .idx{color:var(--cyan);}
  .item .nm{font-size:12.5px;color:#c8dced;line-height:1.25;}
  .item.active .nm{color:#fff;}
  .item .en{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--muted-2);margin-top:2px;text-transform:uppercase;}
  .item .st{width:5px;height:5px;border-radius:50%;background:rgba(120,190,215,.22);transition:.2s;}
  .item.out .st{background:var(--cyan);box-shadow:0 0 9px var(--cyan);}

  /* ============ 详情面板 ============ */
  #detail{padding:16px 16px 18px;}
  .dp-tag{
    display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 9px;border-radius:5px;
    background:rgba(56,232,255,.12);border:1px solid rgba(56,232,255,.3);
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--cyan);
  }
  .dp-code{font-family:var(--mono);font-size:9.5px;color:var(--muted-2);letter-spacing:.14em;}
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
  .dp-title{margin:0;font-size:19px;letter-spacing:.06em;font-weight:600;}
  .dp-en{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted-2);margin-top:5px;text-transform:uppercase;}
  .dp-specs{margin-top:16px;display:grid;gap:1px;background:rgba(120,190,215,.1);border-radius:8px;overflow:hidden;}
  .specrow{display:flex;justify-content:space-between;gap:12px;padding:9px 11px;background:rgba(7,14,21,.85);}
  .specrow span{font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;}
  .specrow b{font-family:var(--mono);font-size:11px;color:#e7f4fb;font-weight:500;text-align:right;}
  .dp-desc{
    margin:16px 0 0;font-size:11.5px;line-height:1.85;color:#9fb6c7;
    padding-left:11px;border-left:1px solid rgba(56,232,255,.28);
  }
  .dp-acts{display:flex;gap:8px;margin-top:18px;}
  .dp-acts .btn{flex:1;justify-content:center;height:32px;font-size:11px;}
  .ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .ov-cell{
    padding:10px 11px;border-radius:9px;background:rgba(56,232,255,.045);
    border:1px solid rgba(120,190,215,.12);
  }
  .ov-cell .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--muted-2);text-transform:uppercase;}
  .ov-cell .v{margin-top:5px;font-size:15px;color:#fff;font-weight:600;letter-spacing:.02em;}
  .ov-cell .v small{font-size:9.5px;color:var(--muted);font-weight:400;margin-left:3px;letter-spacing:.05em;}

  /* ============ 底部操作区 ============ */
  .bottom{
    position:absolute;left:50%;transform:translateX(-50%);bottom:22px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    width:min(760px,calc(100% - 44px));
  }
  .actions{
    display:flex;align-items:center;gap:8px;padding:7px;border-radius:14px;
    background:var(--panel-2);border:1px solid var(--stroke);
    backdrop-filter:blur(16px);box-shadow:0 16px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
    flex-wrap:wrap;justify-content:center;
  }
  .btn{
    display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;
    border-radius:9px;border:1px solid rgba(120,190,215,.16);
    background:rgba(255,255,255,.035);color:#bcd3e3;
    font-family:var(--sans);font-size:12px;letter-spacing:.06em;cursor:pointer;
    transition:.18s;white-space:nowrap;
  }
  .btn:hover{background:rgba(56,232,255,.1);border-color:rgba(56,232,255,.4);color:#fff;}
  .btn:active{transform:translateY(1px);}
  .btn svg{width:13px;height:13px;opacity:.85;}
  .btn.primary{
    background:linear-gradient(135deg,rgba(56,232,255,.9),rgba(40,160,255,.82));
    color:#031018;border-color:transparent;font-weight:600;
    box-shadow:0 6px 22px rgba(56,232,255,.3);
  }
  .btn.primary:hover{box-shadow:0 8px 30px rgba(56,232,255,.45);color:#001;filter:brightness(1.06);}
  .btn.primary.alt{background:linear-gradient(135deg,rgba(255,184,77,.9),rgba(255,120,60,.85));box-shadow:0 6px 22px rgba(255,140,60,.28);}
  .btn.on{background:rgba(56,232,255,.16);border-color:rgba(56,232,255,.5);color:#eafcff;}
  .guide{
    display:flex;align-items:center;gap:18px;font-size:10.5px;color:var(--muted);
    letter-spacing:.08em;font-family:var(--mono);
    background:rgba(6,12,18,.5);border:1px solid rgba(120,190,215,.1);
    padding:6px 16px;border-radius:999px;backdrop-filter:blur(8px);
  }
  .guide span{display:inline-flex;align-items:center;gap:6px;}
  .guide em{color:var(--cyan);font-style:normal;font-size:11px;}
  .guide .sep{width:1px;height:10px;background:rgba(120,190,215,.22);}

  /* ============ 3D 标注 ============ */
  .labels{position:fixed;inset:0;pointer-events:none;z-index:4;}
  .lbl{
    position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;
    font-size:10.5px;letter-spacing:.08em;color:#a8d8e8;white-space:nowrap;
    opacity:0;transition:opacity .35s;
    text-shadow:0 1px 6px rgba(0,0,0,.95);
    will-change:transform;
  }
  .lbl .dot{
    width:7px;height:7px;border-radius:50%;flex:none;
    background:rgba(56,232,255,.9);box-shadow:0 0 10px var(--cyan),0 0 2px #fff inset;
    position:relative;
  }
  .lbl .dot::after{
    content:"";position:absolute;inset:-5px;border-radius:50%;
    border:1px solid rgba(56,232,255,.35);animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.1);opacity:0}}
  .lbl .n{font-family:var(--mono);font-size:9px;color:var(--cyan);opacity:.85;}
  .lbl .txt{padding:2px 7px;border-radius:4px;background:rgba(4,12,18,.62);border:1px solid rgba(56,232,255,.16);}
  .lbl.on{opacity:1;}
  .lbl.sel{color:#fff;}
  .lbl.sel .txt{border-color:rgba(56,232,255,.55);background:rgba(8,30,40,.85);box-shadow:0 0 16px rgba(56,232,255,.25);}

  /* ============ 加载 / 错误 ============ */
  .boot{
    position:fixed;inset:0;z-index:40;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 50%,#081420,#02050a 70%);
    transition:opacity .8s ease,visibility .8s;
  }
  .boot.hide{opacity:0;visibility:hidden;}
  .boot-inner{text-align:center;}
  .boot-ring{
    width:86px;height:86px;margin:0 auto 26px;border-radius:50%;
    border:1px solid rgba(56,232,255,.18);position:relative;
  }
  .boot-ring::before,.boot-ring::after{
    content:"";position:absolute;inset:-1px;border-radius:50%;
    border:1px solid transparent;border-top-color:var(--cyan);
    animation:spin 1.4s linear infinite;
  }
  .boot-ring::after{inset:8px;border-top-color:rgba(56,232,255,.35);animation-duration:2.1s;animation-direction:reverse;}
  .boot-ring b{
    position:absolute;inset:0;display:grid;place-items:center;
    font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--cyan);
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .boot h2{margin:0;font-size:14px;letter-spacing:.4em;font-weight:500;color:#cfe9f5;}
  .boot p{margin:10px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted-2);}
  .fatal{
    position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:30px;
    background:#05090e;text-align:center;
  }
  .fatal.show{display:grid;}
  .fatal div{max-width:520px;font-size:13px;line-height:1.9;color:#c7dceb;}
  .fatal b{color:#ff8a5c;display:block;margin-bottom:10px;font-size:15px;letter-spacing:.1em;}

  /* ============ 移动端 ============ */
  @media (max-width:1080px){
    .panel.left{width:236px;left:12px;}
    .panel.right{width:290px;right:12px;}
    .top-right .chip:nth-child(2){display:none;}
  }
  .mbar{display:none;position:absolute;top:14px;right:14px;gap:8px;z-index:9;}
  .mbar button{
    height:30px;padding:0 12px;border-radius:9px;
    background:rgba(9,18,27,.82);border:1px solid var(--stroke);color:#cfe6f2;
    font-family:var(--sans);font-size:12px;letter-spacing:.1em;
    backdrop-filter:blur(10px);
  }
  .mbar button.on{border-color:rgba(56,232,255,.55);color:#eafcff;background:rgba(56,232,255,.16);}

  @media (max-width:820px){
    .topbar{height:62px;padding:0 14px;}
    .brand h1{font-size:13px;letter-spacing:.14em;}
    .brand .sub{display:none;}
    .brand-mark{width:32px;height:32px;}
    .top-right{display:none;}
    .mbar{display:flex;}
    .chembar{
      top:66px;left:8px;right:8px;transform:none;max-width:none;
      padding:5px 8px;overflow-x:auto;scrollbar-width:none;
    }
    .chembar::-webkit-scrollbar{display:none;}
    .chem-label{display:none;}
    .chem-opts button{font-size:10.5px;padding:0 9px;height:26px;}
    .chem-opts button b{display:none;}
    .toast{bottom:132px;font-size:11px;}
    .panel{
      top:auto;bottom:104px;left:10px;right:10px;width:auto;
      height:56vh;max-height:none;border-radius:14px;
      transform:translateY(116%);opacity:0;pointer-events:none;
      transition:transform .36s cubic-bezier(.2,.8,.2,1),opacity .3s;
    }
    .panel.open{transform:translateY(0);opacity:1;pointer-events:auto;}
    .panel{background:rgba(6,13,20,.94);box-shadow:0 -12px 40px rgba(0,0,0,.7);}
    .panel.left,.panel.right{left:10px;right:10px;width:auto;}
    .bottom{bottom:10px;width:calc(100% - 20px);gap:8px;}
    .guide{display:none;}
    .actions{gap:6px;padding:6px;}
    .btn{height:32px;padding:0 11px;font-size:11px;}
    .btn .lbl-long{display:none;}
    #detail{padding:14px;}
    .dp-title{font-size:16px;}
    .lbl{font-size:9.5px;}
    .lbl .txt{padding:1px 5px;}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="deco">
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="vignette"></div>
</div>

<div class="labels" id="labels"></div>

<div class="ui">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#38e8ff" stroke-width="1.4">
          <path d="M3 17.5h18M5.5 17.5l2.2-7.4a2 2 0 0 1 1.9-1.4h5a2 2 0 0 1 1.9 1.4l2.2 7.4"/>
          <path d="M8.4 10.6h7.2M7.5 20.5a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Zm9 0a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Z"/>
        </svg>
      </div>
      <div>
        <h1>NOVA EV-1 整车拆解台</h1>
        <div class="sub">EV-1 PLATFORM · <b>EXPLODED VIEW</b> · REAL-TIME 3D</div>
      </div>
    </div>
    <div class="mbar">
      <button id="mList" class="on">部件</button>
      <button id="mInfo">详情</button>
    </div>
    <div class="top-right">
      <div class="chip"><i></i><span id="chipPlatform">800V SiC 高压平台</span></div>
      <div class="chip"><i></i>双电机四驱</div>

      <button class="btn on" id="btnRotate" title="自动旋转 (A)">
